[package]
name = "web-cli"
description = "mctas web commands (the in-browser viewer, docs/webrender.md): clap definitions and dispatch only, compiled unoptimized; the work is in crates/mcview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
mctas = { path = "../mctas" }
clock = { path = "../clock" }
mcview = { path = "../mcview" }
redsim = { path = "../redsim" }
circuit-fly = { path = "../circuit-fly" }
circuit = { path = "../circuit" }
# the mob farm's exact run in the bridge (`web check`'s spawn cells against the game's)
mobfarm = { path = "../mobfarm" }
# the door judge in redsim (`web check`'s `door_pair`; already built for the site)
piston-door = { path = "../piston-door" }
# the site's WebKit rig (`web perf --engine webkit`, `web qa`)
site = { path = "../site" }
base64.workspace = true
zip.workspace = true
serde_json.workspace = true
libc = "0.2"
