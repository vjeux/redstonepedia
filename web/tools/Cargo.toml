[package]
name = "tools"
description = "REDSTONEPEDIA's Tools pages in the browser (docs/site.md#tools): the enchanting table calculator and the librarian calculator, Rust compiled to WebAssembly (wasm32-unknown-unknown + wasm-bindgen --target web) on crates/rng; `mctas site build` builds it into site/tools/pkg/"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# its own workspace: the main workspace never builds the browser crate
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
rng = { path = "../../crates/rng" }
serde_json = "1"
# the wasm-bindgen CLI must be this exact version (`mctas site build` checks it)
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlProgressElement",
  "HtmlButtonElement",
  "Event",
  "EventTarget",
  "MessageEvent",
  "Navigator",
  "NodeList",
  "HtmlCollection",
  "DomTokenList",
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "DedicatedWorkerGlobalScope",
  "console",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
